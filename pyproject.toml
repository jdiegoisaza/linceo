[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linceo"
version = "0.1.0.dev0"
description = "DevSecOps tool orchestrator: N tool executions, one verdict."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Juan Diego Isaza", email = "juan.diego-13@hotmail.com" }]
keywords = ["devsecops", "security", "sast", "sca", "secrets-scanning", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer-slim>=0.12,<1.0",
]

[project.urls]
Repository = "https://github.com/jdiegoisaza/linceo"
Issues = "https://github.com/jdiegoisaza/linceo/issues"

[project.scripts]
linceo = "linceo.cli.main:main"

# Namespace for third-party ToolIntegration implementations. Empty today —
# the reference integrations (Gitleaks, Trivy) are built in-tree, not as
# plugins, until a real third-party integration exercises this contract.
[project.entry-points."linceo.tool_integrations"]

# Namespace for third-party ContextProvider implementations. Empty today —
# see linceo.tool_integrations above.
[project.entry-points."linceo.context_providers"]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linceo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations
  "S",    # flake8-bandit — dogfooding in a security tool
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "ARG",  # flake8-unused-arguments
  "ERA",  # eradicate — commented-out code
  "FIX",  # flake8-fixme — TODO/FIXME/XXX/HACK are a lint failure, not a note
  "RUF",  # ruff-specific rules
]
ignore = [
  "D203", # conflicts with D211 (no-blank-line-before-class)
  "D213", # conflicts with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Base configuration, applied to every mypy invocation below. `core/` is
# additionally checked with `--strict` as a separate CLI invocation (see
# CONTRIBUTING.md) — mypy has no per-module `strict = true` override flag,
# so expanding `--strict`'s flag set by hand here would silently drift from
# it whenever mypy adds a flag to `--strict` in a future release.
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-m",
  "not integration",
  "--cov=linceo",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
  "integration: requires real tool binaries on PATH; deselected by default (see tests/integration/README.md)",
]

[tool.coverage.run]
source = ["src/linceo"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
