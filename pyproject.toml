[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "linceo"
dynamic = ["version"]
description = "DevSecOps tool orchestrator: N tool executions, one verdict."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Juan Diego Isaza", email = "juan.diego-13@hotmail.com" }]
keywords = ["devsecops", "security", "sast", "sca", "secrets-scanning", "sarif"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # Pinned exactly, not by range — see ADR §8.3's amendment. typer-slim
    # 0.22.0 inverted its relationship with typer: instead of depending on
    # click + typing-extensions, it now depends on typer itself, dragging
    # in rich, shellingham, pygments, markdown-it-py, mdurl, and
    # annotated-doc. 0.21.1 is the last release before that inversion.
    "typer-slim==0.24.0",
]

# R2: the base package has zero network-client dependencies — remote policy
# resolution (ADR §8.4, "Diseño para una fuente remota futura") is entirely
# opt-in, via this extra. `pip install linceo[remote-config]` is required for
# `linceo.providers.azure_devops.AzureDevOpsPolicySource.fetch` to work at
# all; without it, a `[remote_policy]` declaration still loads (the section
# is only ever *parsed* by the base package) but every fetch attempt fails
# with an actionable message and degrades exactly like a network outage
# would (ADR §5, §8.4).
[project.optional-dependencies]
remote-config = ["httpx>=0.27,<1.0"]

[project.urls]
Repository = "https://github.com/jdiegoisaza/linceo"
Issues = "https://github.com/jdiegoisaza/linceo/issues"

[project.scripts]
linceo = "linceo.cli.main:main"

# Namespace for third-party ToolIntegration implementations. Empty today —
# the reference integrations (Gitleaks, Trivy) are built in-tree, not as
# plugins, until a real third-party integration exercises this contract.
[project.entry-points."linceo.tool_integrations"]

# Namespace for third-party ContextProvider implementations. Empty today —
# see linceo.tool_integrations above.
[project.entry-points."linceo.context_providers"]

[dependency-groups]
dev = [
  # httpx: not a base runtime dependency (see [project.optional-dependencies]
  # "remote-config" and ADR R2) — listed here only so `mypy`/`pytest` can
  # exercise `linceo.providers.azure_devops.AzureDevOpsPolicySource` locally
  # and in CI. `tests/unit/test_dependency_surface.py` walks `uv.lock`'s
  # runtime closure only, never this group, so this never weakens the
  # invariant it enforces.
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/linceo"]

# Single source of truth for the package version: the git tag, not a
# hand-maintained field here (see docs/RELEASING.md). A release tag
# `vX.Y.Z`, checked out clean and exactly at that commit, yields version
# `X.Y.Z`. Any other state derives a PEP 440 pre-release from the commit
# distance to the nearest tag (or from the repo root, before the first tag
# exists) instead of failing, so local dev and non-release CI never need
# git tag history to build.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI rejects uploads carrying a PEP 440 local version segment (the
# `+xxxxxxx` suffix `setuptools-scm` adds for a dirty tree or extra commits
# past a tag). The release workflow always builds from a clean checkout of
# the release tag itself, so this only matters as a guardrail.
local_scheme = "no-local-version"
# Used only when git metadata is entirely unavailable (e.g. a source
# checkout with no `.git` directory at all) rather than merely tag-less —
# matches this project's version before dynamic versioning was introduced.
fallback_version = "0.1.0.dev0"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations
  "S",    # flake8-bandit — dogfooding in a security tool
  "B",    # flake8-bugbear
  "A",    # flake8-builtins
  "C4",   # flake8-comprehensions
  "D",    # pydocstyle
  "PIE",  # flake8-pie
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "SIM",  # flake8-simplify
  "TID",  # flake8-tidy-imports
  "ARG",  # flake8-unused-arguments
  "ERA",  # eradicate — commented-out code
  "FIX",  # flake8-fixme — TODO/FIXME/XXX/HACK are a lint failure, not a note
  "RUF",  # ruff-specific rules
]
ignore = [
  "D203", # conflicts with D211 (no-blank-line-before-class)
  "D213", # conflicts with D212 (multi-line-summary-first-line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Typer's own API requires `typer.Option(...)`/`typer.Argument(...)` calls as
# parameter defaults (ADR §8.3) — B008 already tolerates this for `bool`
# parameters (Typer's own idiom for flags) but not for any other type, so
# every other CLI option needs the same exemption made explicit here rather
# than a `# noqa: B008` on every non-boolean `--flag`.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# Base configuration, applied to every mypy invocation below. `core/` is
# additionally checked with `--strict` as a separate CLI invocation (see
# CONTRIBUTING.md) — mypy has no per-module `strict = true` override flag,
# so expanding `--strict`'s flag set by hand here would silently drift from
# it whenever mypy adds a flag to `--strict` in a future release.
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "-m",
  "not integration",
  "--cov=linceo",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
testpaths = ["tests"]
markers = [
  "integration: requires real tool binaries on PATH; deselected by default (see tests/integration/README.md)",
]

[tool.coverage.run]
source = ["src/linceo"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
