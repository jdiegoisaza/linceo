name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy -p linceo
      - run: uv run mypy tests
      - run: uv run mypy --strict -p linceo.core

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run pytest

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - name: Install the built wheel into a clean environment
        run: |
          uv venv /tmp/linceo-smoke-test
          uv pip install --python /tmp/linceo-smoke-test/bin/python dist/*.whl
          /tmp/linceo-smoke-test/bin/linceo --version
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      # Copied verbatim from gitleaks' own published
      # gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz.sha256 entry for this
      # release — the same version, and the same checksum-verification
      # practice, the reference container image pins (ADR R4, Dockerfile).
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not just the pushed range: gitleaks (via linceo's
          # `secrets` integration) scans it entirely by design (ADR §10) —
          # this is also, precisely, what a range-based diff scan
          # (gitleaks-action's approach) cannot do on a repository's first
          # push, where the range's parent commit does not exist yet.
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          set -eu
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  gitleaks.tar.gz\n' "${GITLEAKS_SHA256}" > gitleaks.tar.gz.sha256
          sha256sum -c gitleaks.tar.gz.sha256
          tar -xzf gitleaks.tar.gz gitleaks
          chmod 0755 gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks.tar.gz.sha256
          gitleaks version

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Verify --platform auto detects github_actions on this real runner
        # The only way to actually exercise `linceo.providers.detection.detect_platform`'s
        # GitHub Actions branch and `linceo.providers.github_actions` against a real
        # GITHUB_* environment (ADR §1, §10) — dogfooding this project's own tool.
        run: |
          uv run linceo context --platform auto | tee linceo-context.txt
          grep -q "Platform: github_actions (auto-detected)" linceo-context.txt

      - name: linceo scan secrets (dogfooding this project's own tool)
        run: uv run linceo scan secrets --platform auto --format sarif > linceo-secrets.sarif

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linceo-secrets-sarif
          path: linceo-secrets.sarif

  sca:
    name: SCA scan
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.74.0"
      # Copied verbatim from trivy's own published
      # trivy_${TRIVY_VERSION}_checksums.txt entry for this release (the
      # amd64 Linux asset) — the same version, and the same
      # checksum-verification practice, the reference container image pins
      # (ADR R4, Dockerfile).
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      # No fetch-depth: 0 here, unlike the "secrets" job — trivy's `fs`
      # scanner reads the checked-out manifest (`uv.lock`) as it stands,
      # never git history, so the default shallow checkout is enough.
      - uses: actions/checkout@v7

      - name: Install trivy (pinned, checksum-verified)
        run: |
          set -eu
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  trivy.tar.gz\n' "${TRIVY_SHA256}" > trivy.tar.gz.sha256
          sha256sum -c trivy.tar.gz.sha256
          tar -xzf trivy.tar.gz trivy
          chmod 0755 trivy
          sudo mv trivy /usr/local/bin/trivy
          rm -f trivy.tar.gz trivy.tar.gz.sha256
          trivy version

      - name: Compute today's date for the vulnerability-db cache key
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache trivy's vulnerability database
        id: trivy-db-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.date.outputs.date }}
          restore-keys: trivy-db-

      - name: Fetch trivy's vulnerability database
        # `linceo scan sca` always runs trivy with `--skip-db-update`
        # (ADR R2/§5: offline by default) — it never fetches a database on
        # its own. This is the one deliberate, explicit network call this
        # job makes, the same one the reference container image's own
        # build step makes (Dockerfile); skipped on a cache hit so a warm
        # cache is never re-downloaded needlessly.
        if: steps.trivy-db-cache.outputs.cache-hit != 'true'
        run: trivy fs --download-db-only .

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Verify --platform auto detects github_actions on this real runner
        run: |
          uv run linceo context --platform auto | tee linceo-context.txt
          grep -q "Platform: github_actions (auto-detected)" linceo-context.txt

      - name: linceo scan sca (dogfooding this project's own tool)
        run: uv run linceo scan sca --platform auto --format sarif > linceo-sca.sarif

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linceo-sca-sarif
          path: linceo-sca.sarif
